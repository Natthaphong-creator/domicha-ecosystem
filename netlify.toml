[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  DOMICHA_FRANCHISE_LEAD_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxKh68k9I6v_x4D2y8RYDOdNdpQ8zxQ306ojohAR5FiB9o47fdEiTGsUYZGnXn_xIKa/exec"
  DOMICHA_RECEIPT_AUTOMATION_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxKh68k9I6v_x4D2y8RYDOdNdpQ8zxQ306ojohAR5FiB9o47fdEiTGsUYZGnXn_xIKa/exec"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
