<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>DomiCha · ตั้งรหัสผ่านสมาชิก</title><link rel="stylesheet" href="style.css"><script type="module" src="activate.js"></script></head><body><main class="member-login"><section class="card member-login-card"><img src="assets/logo.png" width="85" height="85" alt="DomiCha"><span class="eyebrow">WELCOME TO DOMICHA</span><h1>ตั้งรหัสผ่านสมาชิก</h1><p>ตั้งรหัสผ่านของคุณเอง เพื่อเข้าสั่งสินค้าสำหรับสาขา</p><form id="activate" class="form-card"><label>รหัสผ่านใหม่<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" placeholder="อย่างน้อย 12 ตัวอักษร"></label><label>ยืนยันรหัสผ่าน<input name="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128" placeholder="กรอกรหัสผ่านเดิมอีกครั้ง"></label><p id="error" class="error" role="alert"></p><button class="primary" type="submit" disabled>ยืนยันและตั้งรหัสผ่าน</button></form><p id="status" class="member-contact" role="status">กำลังตรวจลิงก์คำเชิญ…</p><a id="sign-in" class="primary" href="/" hidden>เข้าสู่ระบบสมาชิก</a><p class="member-contact">เก็บลิงก์นี้เป็นส่วนตัว<br>หากลิงก์หมดอายุ กรุณาติดต่อทีม DomiCha เพื่อรับลิงก์ใหม่</p></section></main></body></html>
